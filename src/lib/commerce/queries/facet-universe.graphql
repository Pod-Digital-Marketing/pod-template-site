# Every product's facet memberships (slugs) — fetched once (unfiltered) so the server can
# compute DISJUNCTIVE facet counts in JS (count per value = results matching all OTHER active
# facets, ignoring the value's own facet — the correct count for multi-select facets, and it
# prevents zero-result combinations). Small payload (slugs only).
query FacetUniverse {
  products(first: 200, where: { status: "publish", visibility: CATALOG }) {
    nodes {
      databaseId
      name
      # Both fragments MUST list identical fields — a simple product line (e.g. non-variant
      # accessories/sundries) is just as valid a catalogue shape as a variable one, and this
      # query previously only matched VariableProduct: the universe silently went empty for any
      # all-SimpleProduct catalogue, and every disjunctive facet count showed (0) (found on
      # pod-site-the-paint-guys 2026-09-14 — see FRICTION.md).
      ... on SimpleProduct {
        stockStatus
        price(format: RAW)
        productCategories { nodes { slug } }
        terms(where: { taxonomies: [PRODUCTBRAND] }) { nodes { slug } }
        allPaGender { nodes { slug } }
        allPaDrop { nodes { slug } }
        allPaCushioning { nodes { slug } }
        allPaPronation { nodes { slug } }
        allPaWeight { nodes { slug } }
        allPaWidth { nodes { slug } }
        allPaColour { nodes { slug } }
      }
      ... on VariableProduct {
        stockStatus
        price(format: RAW)
        productCategories { nodes { slug } }
        terms(where: { taxonomies: [PRODUCTBRAND] }) { nodes { slug } }
        allPaGender { nodes { slug } }
        allPaDrop { nodes { slug } }
        allPaCushioning { nodes { slug } }
        allPaPronation { nodes { slug } }
        allPaWeight { nodes { slug } }
        allPaWidth { nodes { slug } }
        allPaColour { nodes { slug } }
      }
    }
  }
}
